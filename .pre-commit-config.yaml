repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: bun run fmt
        language: system
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: bun run lint
        language: system
        pass_filenames: false
      - id: konsistent
        name: konsistent
        entry: bun run konsistent
        language: system
        pass_filenames: false
